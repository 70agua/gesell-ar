<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- La Mordida — símbolo de Cuponear.
       Cuadrado redondeado con un círculo recortado en el vértice superior
       derecho (r = 30% del lado). El mordisco es transparente, no blanco:
       funciona sobre cualquier fondo. -->
  <mask id="mordisco">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#fff"/>
    <circle cx="100" cy="0" r="30" fill="#000"/>
  </mask>
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#475BE1" mask="url(#mordisco)"/>
</svg>
