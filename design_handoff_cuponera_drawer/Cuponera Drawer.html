<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>gesell.ar — Cuponera Drawer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F7F7F8; font-family: 'Geist', system-ui, sans-serif; }
  #root { width: 100vw; min-height: 100vh; }

  /* placeholder photo backgrounds */
  .ph { background-size: cover; background-position: center; position: relative; overflow: hidden; }
  .ph::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,0.25) 100%); pointer-events:none; }
  .ph-beach    { background: linear-gradient(180deg,#a8c8d8 0%, #d4b896 65%, #e8d4b0 100%); }
  .ph-sunset   { background: linear-gradient(180deg,#1a2a4a 0%, #c75a4a 50%, #f4b860 100%); }
  .ph-forest   { background: linear-gradient(180deg,#2d3e2a 0%, #4a5a3a 50%, #1f2a1c 100%); }
  .ph-cabana   { background: linear-gradient(135deg,#6b4a2a 0%, #3a2818 100%); }
  .ph-interior { background: linear-gradient(135deg,#e8dcc6 0%, #c4b8a0 100%); }
  .ph-cerveza  { background: linear-gradient(180deg,#3a2515 0%, #c08040 50%, #f4d090 100%); }
  .ph-rest     { background: linear-gradient(135deg,#2a1f15 0%, #4a3525 50%, #1a1410 100%); }
  .ph-bosque   { background: linear-gradient(180deg,#2a3a2a 0%, #5a6a3a 100%); }
  .ph-spa      { background: linear-gradient(135deg,#d8e8e8 0%, #b8c8d4 50%, #8aa8b8 100%); }
  .ph-pool     { background: linear-gradient(180deg,#3aa8c8 0%, #7ac8d8 50%, #b8d8c8 100%); }
  .ph-coffee   { background: linear-gradient(135deg,#3a2515 0%, #6a4520 50%, #c8b894 100%); }
  .ph-night    { background: linear-gradient(180deg,#0a1530 0%, #2a3560 70%, #4a4570 100%); }
  .ph-morning  { background: linear-gradient(180deg,#f4d4a8 0%, #f8a878 50%, #d87858 100%); }

  /* avatar placeholders */
  .av { border-radius: 50%; background: linear-gradient(135deg,#9c8ad8,#6a8ad8); display:inline-block; }
  .av-1 { background: linear-gradient(135deg,#e08a5a,#a85228); }
  .av-2 { background: linear-gradient(135deg,#4a8ad8,#1a4a98); }
  .av-3 { background: linear-gradient(135deg,#888,#444); }
  .av-4 { background: linear-gradient(135deg,#d8a87a,#a8784a); }
  .av-5 { background: linear-gradient(135deg,#c88aa8,#a85878); }

  button { font-family: inherit; cursor: pointer; }
  a { text-decoration: none; color: inherit; }

  /* animaciones del drawer de confirmación */
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes rise { 0% { transform: translateY(16px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

  /* entrada/salida del drawer lateral */
  @keyframes drawerIn  { from { transform: translateX(105%); } to { transform: translateX(0); } }
  @keyframes drawerOut { from { transform: translateX(0); } to { transform: translateX(105%); } }
  @keyframes scrimIn   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scrimOut  { from { opacity: 1; } to { opacity: 0; } }

  /* scrollbar fino dentro del drawer */
  aside ::-webkit-scrollbar { width: 8px; }
  aside ::-webkit-scrollbar-thumb { background: rgba(11,16,32,0.16); border-radius: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/primitives.jsx"></script>
<script type="text/babel" src="components/dirA.jsx"></script>
<script type="text/babel" src="components/dirA-more.jsx"></script>
<script type="text/babel" src="components/cuponera-drawer.jsx"></script>
</body>
</html>
