<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Imágenes de socios · gesell.ar</title>
<style>
  :root{
    --primary:#2545E6; --primary-dark:#1731B8; --ink:#0B1020; --ink2:#3D4255;
    --muted:#6B7280; --line:#E7E9EE; --bg:#F7F7F8; --green:#10A36B; --red:#EF4444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;box-shadow:0 2px 12px -8px rgba(11,16,32,.2)}
  .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
  h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
  h1 span{color:var(--primary)}
  .grow{flex:1}
  input[type=text],input[type=email],input[type=password]{
    padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;outline:none;font-family:inherit;color:var(--ink)}
  input:focus{border-color:var(--primary)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:600;font-size:13px}
  .btn{background:var(--primary);color:#fff;padding:8px 16px}
  .btn:hover{background:var(--primary-dark)}
  .btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
  .pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px}
  .pill.on{background:#EDFAF4;color:var(--green)}
  .pill.off{background:#FEF2F2;color:var(--red)}
  main{max-width:1400px;margin:0 auto;padding:20px 24px 80px}
  .hint{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.5}
  .card{display:grid;grid-template-columns:280px 1fr;gap:20px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
  .socio-name{font-size:16px;font-weight:800;margin:0 0 4px;line-height:1.25}
  .socio-meta{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  .socio-meta b{color:var(--ink2);font-weight:600}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#EEF1FF;color:var(--primary);margin-top:8px}
  .imgs{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
  .slot{width:130px}
  .slot .label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
  .thumb{position:relative;width:130px;height:130px;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
  .thumb.portada{border:2px solid var(--primary)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#C0C4CE;font-size:11px;text-align:center;padding:8px}
  .tools{position:absolute;inset:auto 0 0 0;display:flex;gap:6px;justify-content:center;padding:7px;background:linear-gradient(to top,rgba(11,16,32,.78),transparent);opacity:0;transition:opacity .15s}
  .thumb:hover .tools{opacity:1}
  .tools button{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0;background:rgba(255,255,255,.95)}
  .tools button:hover{background:#fff}
  .tools button.del:hover svg{stroke:var(--red)}
  .tools button svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .addbox{width:130px;height:130px;border-radius:12px;border:2px dashed var(--line);background:#fff;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;margin-top:19px}
  .addbox:hover{border-color:var(--primary);color:var(--primary)}
  .addbox svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .busy{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--primary)}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
  #toast.show{opacity:1}
  #toast.err{background:var(--red)}
  #toast.ok{background:var(--green)}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
  @media (max-width:720px){.card{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Imágenes de <span>socios</span></h1>
    <input type="text" id="search" placeholder="Buscar por nombre o localidad…" style="min-width:220px" />
    <span class="grow"></span>
    <div id="authbox" style="display:flex;align-items:center;gap:8px"></div>
    <button class="btn ghost" id="reload">↻ Recargar</button>
  </div>
</header>

<main>
  <p class="hint">
    Mostrás las imágenes del <b>perfil del socio</b> (portada + galería), no las de sus cupones.
    Pasá el mouse sobre cada imagen para <b>reemplazarla</b> (↑) o <b>eliminarla</b> (🗑).
    Para editar necesitás <b>iniciar sesión como superadmin</b> arriba a la derecha.
  </p>
  <div id="list"><div class="empty-state">Cargando socios…</div></div>
</main>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://wxuvexwcypgzlboasdvx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vRei2o9O5s_d3Bf8z3daSA_GwlBNO46';
const BUCKET = 'negocios';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const state = { session:null, negocios:[], filter:'' };
const $ = s => document.querySelector(s);
const listEl = $('#list');

// ── Utils ──────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const extOf = f => (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';

function toast(msg, kind=''){
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + kind;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.className=''; }, 3200);
}
function pickFile(){
  return new Promise(res=>{
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*';
    inp.onchange = ()=> res(inp.files[0] || null);
    inp.click();
  });
}
function pathFromUrl(url){
  const m = url && url.match(/\/storage\/v1\/object\/public\/negocios\/(.+)$/);
  return m ? decodeURIComponent(m[1].split('?')[0]) : null;
}
async function removeStorage(url){
  const p = pathFromUrl(url);
  if(p){ try{ await supabase.storage.from(BUCKET).remove([p]); }catch(_){} }
}
async function uploadTo(path, file){
  const { data, error } = await supabase.storage.from(BUCKET).upload(path, file, { upsert:true });
  if(error) throw error;
  const { data:pub } = supabase.storage.from(BUCKET).getPublicUrl(data.path);
  return pub.publicUrl;
}
async function updateNegocio(id, patch){
  const { error } = await supabase.from('negocios').update(patch).eq('id', id);
  if(error) throw error;
}
function requireAuth(){
  if(!state.session){ toast('Iniciá sesión como superadmin para editar', 'err'); return false; }
  return true;
}

// ── Auth UI ────────────────────────────────────────────
function renderAuth(){
  const box = $('#authbox');
  if(state.session){
    box.innerHTML = `<span class="pill on">● ${esc(state.session.user.email)}</span>
      <button class="btn ghost" id="logout">Salir</button>`;
    $('#logout').onclick = async ()=>{ await supabase.auth.signOut(); state.session=null; renderAuth(); toast('Sesión cerrada'); loadNegocios(); };
  } else {
    box.innerHTML = `
      <input type="email" id="email" placeholder="email superadmin" value="70agua@gmail.com" style="width:180px" />
      <input type="password" id="pass" placeholder="contraseña" style="width:130px" />
      <button class="btn" id="login">Ingresar</button>`;
    $('#login').onclick = doLogin;
    $('#pass').onkeydown = e => { if(e.key==='Enter') doLogin(); };
  }
}
async function doLogin(){
  const email = $('#email').value.trim(), password = $('#pass').value;
  if(!email || !password){ toast('Completá email y contraseña','err'); return; }
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ toast('No se pudo ingresar: ' + error.message, 'err'); return; }
  state.session = data.session; renderAuth(); toast('¡Bienvenido! Cargando todos los socios…','ok');
  await loadNegocios(); // ya autenticado como superadmin → se ven TODOS (incl. no aprobados/inactivos)
}

// ── Data ───────────────────────────────────────────────
async function loadNegocios(){
  listEl.innerHTML = '<div class="empty-state">Cargando socios…</div>';
  const { data, error } = await supabase
    .from('negocios')
    .select('id, nombre, tipo, localidad, imagen_url, galeria, activo')
    .order('nombre', { ascending:true });
  if(error){ listEl.innerHTML = `<div class="empty-state">Error: ${esc(error.message)}</div>`; return; }
  state.negocios = (data||[]).map(n => ({
    ...n,
    galeria: Array.isArray(n.galeria) ? n.galeria.filter(Boolean) : [],
    _bust: 0,
  }));
  mountList();
}
const byId = id => state.negocios.find(n => String(n.id) === String(id));

// ── Render ─────────────────────────────────────────────
function thumbHTML(src, { portada=false, act, i }){
  const bust = portada && src ? '' : ''; // (galería usa URLs únicas; portada se refresca al reemplazar)
  const img = src
    ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;empty&quot;>imagen rota</div>'" />`
    : `<div class="empty">sin imagen</div>`;
  const del = src ? `<button class="del" title="Eliminar" data-act="${act.del}" ${i!=null?`data-i="${i}"`:''}>
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>` : '';
  return `<div class="thumb ${portada?'portada':''}">
    ${img}
    <div class="tools">
      <button title="Reemplazar" data-act="${act.rep}" ${i!=null?`data-i="${i}"`:''}>
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      ${del}
    </div>
  </div>`;
}

function cardHTML(n){
  const portadaSrc = n.imagen_url ? n.imagen_url + (n._bust ? `?t=${n._bust}` : '') : '';
  const portada = `<div class="slot">
    <div class="label">Portada / logo</div>
    ${thumbHTML(portadaSrc, { portada:true, act:{ rep:'rep-portada', del:'del-portada' } })}
  </div>`;
  const galeria = n.galeria.map((src,i) => `<div class="slot">
      <div class="label">Galería ${i+1}</div>
      ${thumbHTML(src, { act:{ rep:'rep-gal', del:'del-gal' }, i })}
    </div>`).join('');
  const add = `<button class="addbox" data-act="add-gal" title="Agregar a la galería">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Agregar
    </button>`;
  return `<div class="card" id="card-${esc(n.id)}" data-id="${esc(n.id)}">
    <div>
      <div class="socio-name">${esc(n.nombre || '(sin nombre)')}</div>
      <div class="socio-meta">
        <span><b>Tipo:</b> ${esc(n.tipo || '—')}</span>
        <span><b>Localidad:</b> ${esc(n.localidad || '—')}</span>
        <span style="font-size:11px;color:#AEB2BD"><b>ID:</b> ${esc(n.id)}</span>
      </div>
      <span class="tag" style="${n.activo===false?'background:#FEF2F2;color:var(--red)':''}">${n.activo===false?'inactivo':'activo'} · ${n.galeria.length} en galería</span>
    </div>
    <div class="imgs">${portada}${galeria}${add}</div>
  </div>`;
}

function visibleNegocios(){
  const f = state.filter.trim().toLowerCase();
  if(!f) return state.negocios;
  return state.negocios.filter(n =>
    (n.nombre||'').toLowerCase().includes(f) || (n.localidad||'').toLowerCase().includes(f));
}
function mountList(){
  const items = visibleNegocios();
  if(!items.length){ listEl.innerHTML = '<div class="empty-state">No hay socios que coincidan.</div>'; return; }
  listEl.innerHTML = items.map(cardHTML).join('');
}
function refreshCard(n){
  const el = document.getElementById('card-'+n.id);
  if(el) el.outerHTML = cardHTML(n);
}
function setBusy(id, on){
  const el = document.getElementById('card-'+id);
  if(!el) return;
  let b = el.querySelector('.busy');
  if(on && !b){ b = document.createElement('div'); b.className='busy'; b.textContent='Guardando…'; el.style.position='relative'; el.appendChild(b); }
  if(!on && b) b.remove();
}

// ── Operaciones ────────────────────────────────────────
async function op(id, fn){
  if(!requireAuth()) return;
  setBusy(id, true);
  try{ await fn(); }
  catch(e){ toast('Error: ' + (e.message||e), 'err'); }
  finally{ setBusy(id, false); }
}

async function repPortada(n){
  const f = await pickFile(); if(!f) return;
  await op(n.id, async ()=>{
    const url = await uploadTo(`logos/${n.id}.${extOf(f)}`, f);
    await updateNegocio(n.id, { imagen_url: url });
    n.imagen_url = url; n._bust = Date.now();
    refreshCard(n); toast('Portada actualizada','ok');
  });
}
async function delPortada(n){
  if(!confirm('¿Eliminar la portada de "'+(n.nombre||'')+'"?')) return;
  await op(n.id, async ()=>{
    const old = n.imagen_url;
    await updateNegocio(n.id, { imagen_url: null });
    removeStorage(old);
    n.imagen_url = null; refreshCard(n); toast('Portada eliminada','ok');
  });
}
async function repGal(n, i){
  const f = await pickFile(); if(!f) return;
  await op(n.id, async ()=>{
    const url = await uploadTo(`galeria/${n.id}/${Date.now()}-${i}.${extOf(f)}`, f);
    const old = n.galeria[i];
    const galeria = [...n.galeria]; galeria[i] = url;
    await updateNegocio(n.id, { galeria });
    removeStorage(old);
    n.galeria = galeria; refreshCard(n); toast('Imagen reemplazada','ok');
  });
}
async function delGal(n, i){
  if(!confirm('¿Eliminar esta imagen de la galería?')) return;
  await op(n.id, async ()=>{
    const old = n.galeria[i];
    const galeria = n.galeria.filter((_,j)=> j!==i);
    await updateNegocio(n.id, { galeria });
    removeStorage(old);
    n.galeria = galeria; refreshCard(n); toast('Imagen eliminada','ok');
  });
}
async function addGal(n){
  const f = await pickFile(); if(!f) return;
  await op(n.id, async ()=>{
    const url = await uploadTo(`galeria/${n.id}/${Date.now()}-${n.galeria.length}.${extOf(f)}`, f);
    const galeria = [...n.galeria, url];
    await updateNegocio(n.id, { galeria });
    n.galeria = galeria; refreshCard(n); toast('Imagen agregada','ok');
  });
}

// ── Eventos (delegación) ───────────────────────────────
listEl.addEventListener('click', e=>{
  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const card = btn.closest('.card'); if(!card) return;
  const n = byId(card.dataset.id); if(!n) return;
  const i = btn.dataset.i != null ? Number(btn.dataset.i) : null;
  switch(btn.dataset.act){
    case 'rep-portada': repPortada(n); break;
    case 'del-portada': delPortada(n); break;
    case 'rep-gal': repGal(n, i); break;
    case 'del-gal': delGal(n, i); break;
    case 'add-gal': addGal(n); break;
  }
});
$('#search').addEventListener('input', e=>{ state.filter = e.target.value; mountList(); });
$('#reload').addEventListener('click', loadNegocios);

// ── Init ───────────────────────────────────────────────
(async ()=>{
  const { data } = await supabase.auth.getSession();
  state.session = data.session || null;
  renderAuth();
  await loadNegocios();
})();
</script>
</body>
</html>
